<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <title>Day 27 · Ordinal — 30 Wordles</title>
  <link rel="stylesheet" href="../../css/styles.css">
  <script>
    (function () {
      var t;
      try { t = localStorage.getItem("30wordles-theme"); } catch (e) {}
      if (t !== "dark" && t !== "light") {
        t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = t;

      try { if (localStorage.getItem("30wordles-colorblind") === "on") document.documentElement.dataset.colorblind = "on"; } catch (e) {}
    })();
  </script>
</head>
<body class="ordinal">

  <header class="site-header">
    <a class="wordmark" href="../../index.html">30 <span>Wordles</span></a>
    <div class="header-actions">
      <button class="circle-btn" id="cb-toggle" type="button" aria-label="Toggle colorblind mode" aria-pressed="false" title="Colorblind mode: orange / blue marks">
        <svg class="icon-cb" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="circle-btn theme-toggle" type="button" aria-label="Toggle dark / light theme" title="Toggle dark / light theme">

      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    </div>
  </header>

  <main class="page narrow">
    <p class="eyebrow">Day 27</p>
    <h1 class="ordinal-title" aria-label="Ordinal"><span>O</span><span>r</span><span>d</span><span>i</span><span>n</span><span>a</span><span>l</span></h1>
    <p class="lede">Your guesses arrive in alphabetical order.</p>

    <section class="rules">
      <h2>Rules</h2>
      <ul>
        <li>Every guess is <strong>sorted alphabetically</strong> before it lands. The sorted word is what gets judged.</li>
        <li>5 greens to win. Typing <strong>the answer itself</strong> always wins.</li>
      </ul>
    </section>

    <div class="game ordinal-game">
      <div class="orentry" id="entry" aria-label="Your guess"></div>
      <div class="sort-line" aria-hidden="true"></div>
      <div class="orboard" id="board" aria-label="Ordinal board"></div>
      <div class="game-actions">
        <button class="btn" id="new-btn" type="button">Practice</button>
        <button class="btn" id="giveup-btn" type="button">Give up</button>
        <button class="btn primary hidden" id="share-btn" type="button">Share result</button>
      </div>
      <div class="keyboard" id="keyboard"></div>
    </div>

    <nav class="day-nav" aria-label="More days">
      <a href="../26/"><span class="arrow">&larr;</span> Day 26</a>
      <a href="../28/">Day 28 <span class="arrow">&rarr;</span></a>
    </nav>
  </main>

  <footer class="site-footer">30Wordle: Made with 💙 by Suitangi</footer>

  <div class="toast" id="toast" role="status"></div>

  <script src="../../js/words.js"></script>
  <script src="../../js/ordinal.js"></script>
  <script src="../../js/colorblind.js"></script>
  <script src="../../js/theme.js"></script>
</body>
</html>
